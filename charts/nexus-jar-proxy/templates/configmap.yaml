apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  nginx.conf.template: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      # Avoid logging URL queries and credentials.
      log_format download '$remote_addr $request_method $uri $status $body_bytes_sent';
      access_log /dev/stdout download;
      server_tokens off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8080;
        location = /healthz {
          access_log off;
          default_type text/plain;
          return 200 "ok\n";
        }
        location {{ include "nexus-jar-proxy.rootPath" . }} {
          limit_except GET { deny all; }
          # Replace the proxy root path with the Nexus root path; keep the suffix and query.
          proxy_pass {{ trimSuffix "/" .Values.nexus.url }}/;
          proxy_http_version 1.1;
          proxy_pass_request_headers off;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header Connection "";
          proxy_set_header Host $proxy_host;
          proxy_set_header Authorization "Basic ${NEXUS_AUTH}";
          proxy_set_header Range $http_range;
          proxy_set_header If-Range $http_if_range;
          proxy_set_header If-None-Match $http_if_none_match;
          proxy_set_header If-Modified-Since $http_if_modified_since;
          proxy_ssl_server_name on;
          proxy_ssl_verify on;
          proxy_ssl_verify_depth 5;
          {{- if .Values.nexus.caConfigMap }}
          proxy_ssl_trusted_certificate /ca/ca.crt;
          {{- else }}
          proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
          {{- end }}
          proxy_connect_timeout 10s;
          proxy_read_timeout 300s;
          proxy_buffering off;
          proxy_max_temp_file_size 0;
          proxy_hide_header Set-Cookie;
          proxy_ignore_headers X-Accel-Redirect;
          proxy_redirect default;
        }
        {{- if ne (include "nexus-jar-proxy.rootPath" .) "/" }}
        location / { return 404; }
        {{- end }}
      }
    }
