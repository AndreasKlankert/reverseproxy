{{- if .Values.externalSecret.enabled }}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-nexus-credentials
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required when externalSecret.enabled=true" .Values.externalSecret.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.nexus.existingSecret | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.nexus.usernameKey | quote }}
      remoteRef:
        key: {{ required "externalSecret.username.key is required when externalSecret.enabled=true" .Values.externalSecret.username.key | quote }}
        {{- if .Values.externalSecret.username.property }}
        property: {{ .Values.externalSecret.username.property | quote }}
        {{- end }}
    - secretKey: {{ .Values.nexus.passwordKey | quote }}
      remoteRef:
        key: {{ required "externalSecret.password.key is required when externalSecret.enabled=true" .Values.externalSecret.password.key | quote }}
        {{- if .Values.externalSecret.password.property }}
        property: {{ .Values.externalSecret.password.property | quote }}
        {{- end }}
{{- end }}
